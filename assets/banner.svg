<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Fellipe Raszejas</title>
  <desc id="d">Software Developer, Product Owner e competidor SPSkills. Linha de trajetória de 2024 a 2028, com a WorldSkills como meta.</desc>

  <rect width="1200" height="320" fill="#16202E"/>

  <!-- Identidade -->
  <text x="72" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#F1F3F5">Fellipe Raszejas</text>
  <text x="74" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#A9B8C9">Software Developer, Product Owner, SPSkills</text>

  <!-- Eixo do tempo -->
  <line x1="700" y1="262" x2="1120" y2="262" stroke="#2B3A4E" stroke-width="2"/>
  <g stroke="#2B3A4E" stroke-width="2">
    <line x1="700" y1="256" x2="700" y2="268"/>
    <line x1="805" y1="256" x2="805" y2="268"/>
    <line x1="910" y1="256" x2="910" y2="268"/>
    <line x1="1015" y1="256" x2="1015" y2="268"/>
    <line x1="1120" y1="256" x2="1120" y2="268"/>
  </g>

  <!-- Trajetória: sólida até o presente, tracejada até a meta -->
  <polyline points="700,236 805,214 910,180" fill="none" stroke="#7FB3D5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="910,180 1015,140 1120,86" fill="none" stroke="#7FB3D5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 9"/>

  <circle cx="700" cy="236" r="5" fill="#7FB3D5"/>
  <circle cx="805" cy="214" r="5" fill="#7FB3D5"/>
  <circle cx="910" cy="180" r="8" fill="#F1F3F5"/>
  <circle cx="1015" cy="140" r="5" fill="#16202E" stroke="#7FB3D5" stroke-width="2"/>
  <circle cx="1120" cy="86" r="8" fill="#16202E" stroke="#E4572E" stroke-width="3"/>

  <!-- Anos -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7E8FA3" text-anchor="middle">
    <text x="700" y="290">2024</text>
    <text x="805" y="290">2025</text>
    <text x="910" y="290" fill="#F1F3F5" font-weight="700">2026</text>
    <text x="1015" y="290">2027</text>
    <text x="1120" y="290">2028</text>
  </g>
  <text x="1120" y="62" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#E4572E" text-anchor="middle">WorldSkills</text>
</svg>
